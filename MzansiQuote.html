/* ---------- helpers ---------- */
const VAT_RATE = 0.15;
const r2 = (x) => Math.round(x * 100) / 100;
const num = (v) => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isNaN(n) ? 0 : n; };
const money = (n) => "R " + (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = (n) => String(n).padStart(4, "0");
const iso = (offsetDays = 0) => {
  const d = new Date(); d.setDate(d.getDate() + offsetDays);
  const m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
};
const fmtDate = (s) => s ? new Date(s + "T00:00:00").toLocaleDateString("en-ZA", { day: "numeric", month: "short", year: "numeric" }) : "";
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

const calc = (j) => {
  const items = r2(j.items.reduce((s, i) => s + num(i.qty) * num(i.price), 0));
  const callOut = num(j.callOut);
  const sub = r2(items + callOut);
  const vat = j.vat ? r2(sub * VAT_RATE) : 0;
  return { items, callOut, sub, vat, total: r2(sub + vat) };
};
const isOverdue = (j) => j.status === "unpaid" && j.due && j.due < iso(0);
const firstName = (n) => (n || "there").trim().split(/\s+/)[0];

/* SA number -> wa.me format (0821234567 -> 27821234567) */
const waNumber = (raw) => {
  let d = String(raw || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("27")) return d;
  if (d.startsWith("0")) return "27" + d.slice(1);
  return d ? "27" + d : "";
};
const waLink = (phone, text) => `https://wa.me/${waNumber(phone)}?text=${encodeURIComponent(text)}`;

/* ---------- Magic Fill parser ---------- */
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function parseNotes(text) {
  const parts = text.split(/\n|;|,(?!\d{3}\b)/).map((s) => s.trim()).filter(Boolean);
  const items = []; let callOut = null;
  parts.forEach((p) => {
    let s = p.replace(/^(and|plus|&)\s+/i, ""), qty = 1, price = 0, unit = "";
    const pm = s.match(/(?:R|ZAR)\s*(\d+(?:[ ,]\d{3})*(?:\.\d{1,2})?)/i);
    if (pm) { price = parseFloat(pm[1].replace(/[ ,]/g, "")); s = s.replace(pm[0], " "); }
    const qm = s.match(/^\s*(\d+(?:\.\d+)?)\s*(?:x|×)\s*/i);
    const hm = s.match(/(\d+(?:\.\d+)?)\s*(hrs?|hours?|days?)\b/i);
    if (qm) { qty = parseFloat(qm[1]); s = s.slice(qm[0].length); }
    else if (hm) {
      qty = parseFloat(hm[1]);
      unit = /^d/i.test(hm[2]) ? "days" : "hrs";
      s = s.replace(hm[0], " ");
    }
    s = s.replace(/\b(at|each|per|@|for|-|–)\b/gi, " ").replace(/\s+/g, " ").replace(/^[\s\-–:@]+|[\s\-–:@]+$/g, "");
    if (!s) return;
    if (/^call[\s-]?out/i.test(s)) { callOut = price; return; }
    items.push({ id: uid(), desc: cap(s) + (unit ? ` (${unit})` : ""), qty: String(qty), price: price ? String(price) : "" });
  });
  return { items, callOut };
}

/* ---------- Messages ---------- */
const bankLines = (b) => [
  "*Pay by EFT*",
  `Bank: ${b.bankName}`,
  `Account name: ${b.accName}`,
  `Account no: ${b.accNo}`,
  `Branch code: ${b.branch}`,
];
function docMessage(job, biz) {
  const t = calc(job), isQuote = job.status === "quoted";
  const lines = job.items.filter((i) => i.desc).map((i) => `• ${i.qty} × ${i.desc} – ${money(num(i.qty) * num(i.price))}`);
  const out = [
    `Hi ${firstName(job.client)} 👋`,
    `Thanks for choosing ${biz.name}. Here is your ${isQuote ? "quote" : "invoice"} *${job.no}*:`,
    "", `*${job.title}*`, ...lines,
  ];
  if (t.callOut) out.push(`• Call-out fee – ${money(t.callOut)}`);
  out.push("", `Subtotal: ${money(t.sub)}`);
  if (job.vat) out.push(`VAT (15%): ${money(t.vat)}`);
  out.push(`*Total: ${money(t.total)}*`, "");
  if (isQuote) out.push("This quote is valid for 14 days. Reply *YES* to confirm and we'll book you in. ✅", "");
  else out.push(...bankLines(biz), `Reference: ${job.no}`, "");
  if (!isQuote && biz.payLink) out.push(`Or pay online by card: ${biz.payLink}`, "");
  out.push("Thank you! 🙏", `${biz.name}`, biz.phone);
  return out.join("\n");
}
function reminderMessage(job, biz) {
  const t = calc(job), od = isOverdue(job);
  const out = [
    `Hi ${firstName(job.client)}, hope you're well 🙂`,
    "",
    `Just a friendly reminder that invoice *${job.no}* for "${job.title}" (${money(t.total)}) from ${biz.name} ${od ? `was due on ${fmtDate(job.due)} and is now ${daysBetween(job.due, iso(0))} day(s) overdue` : `is due on ${fmtDate(job.due)}`}.`,
    "", ...bankLines(biz), `Reference: ${job.no}`,
  ];
  if (biz.payLink) out.push("", `Prefer to pay by card? ${biz.payLink}`);
  out.push("", "If you've already paid, please send the proof of payment and ignore this message. Thank you so much! 🙏", `– ${biz.name}`);
  return out.join("\n");
}

function JobCard({ job, biz, onView, onEdit, onConvert, onPaid }) {
  const t = calc(job), od = isOverdue(job);
  const badge = job.status === "paid"
    ? { cls: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30", label: "Paid" }
    : job.status === "unpaid"
      ? od ? { cls: "bg-red-500/15 text-red-400 border-red-500/30", label: `Overdue · ${daysBetween(job.due, iso(0))}d` }
           : { cls: "bg-orange-500/15 text-orange-400 border-orange-500/30", label: "Unpaid" }
      : { cls: "bg-amber-500/15 text-amber-400 border-amber-500/30", label: "Quoted" };
  const sub = job.status === "paid" ? `Paid ${fmtDate(job.paidDate)}` : job.status === "unpaid" ? `Due ${fmtDate(job.due)}` : `Quoted ${fmtDate(job.date)}`;
  return (
    <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="truncate font-semibold text-white">{job.title}</div>
          <div className="mt-0.5 text-sm text-slate-400">{job.client} · <span className="text-slate-500">{job.no}</span></div>
        </div>
        <div className="shrink-0 text-right">
          <div className="text-lg font-extrabold text-white">{money(t.total)}</div>
          <span className={`mt-1 inline-block rounded-full border px-2 py-0.5 text-[11px] font-semibold ${badge.cls}`}>{badge.label}</span>
        </div>
      </div>
      <div className="mt-1 text-xs text-slate-500">{sub}</div>

      <div className="mt-3 grid grid-cols-2 gap-2">
        {job.status === "quoted" && (<>
          <button className={`${btnPrimary} col-span-2`} onClick={() => onConvert(job.id)}><Icon name="repeat" /> Convert to Unpaid Invoice</button>
          <a className={btnWa} href={waLink(job.phone, docMessage(job, biz))} target="_blank" rel="noopener noreferrer"><Icon name="chat" /> Send Quote</a>
          <button className={btnGhost} onClick={() => onEdit(job)}><Icon name="pencil" /> Edit</button>
        </>)}
        {job.status === "unpaid" && (<>
          <a className={`${btnWa} col-span-2`} href={waLink(job.phone, reminderMessage(job, biz))} target="_blank" rel="noopener noreferrer"><Icon name="bell" /> Send Payment Reminder</a>
          <button className={btnPrimary} onClick={() => onPaid(job.id)}><Icon name="checkCircle" /> Mark as Paid</button>
        </>)}
        {job.status === "paid" && (
          <a className={btnWa} href={waLink(job.phone, `Hi ${firstName(job.client)} 👋 payment for invoice ${job.no} (${money(t.total)}) received — thank you so much! 🙏\n– ${biz.name}`)} target="_blank" rel="noopener noreferrer"><Icon name="chat" /> Thank client</a>
        )}
        <button className={btnGhost} onClick={() => onView(job)}><Icon name="eye" /> View</button>
      </div>
    </div>
  );
}

/* ---------- Builder ---------- */
function Builder({ draft, setDraft, biz, nextNo, onBack, onSave, toast }) {
  const upd = (patch) => setDraft((d) => ({ ...d, ...patch }));
  const updItem = (id, patch) => setDraft((d) => ({ ...d, items: d.items.map((i) => (i.id === id ? { ...i, ...patch } : i)) }));
  const addItem = () => setDraft((d) => ({ ...d, items: [...d.items, { id: uid(), desc: "", qty: "1", price: "" }] }));
  const rmItem = (id) => setDraft((d) => ({ ...d, items: d.items.filter((i) => i.id !== id) }));

  const magic = () => {
    const { items, callOut } = parseNotes(draft.notes || "");
    if (!items.length && callOut == null) { toast("Couldn't spot any items — try “2x pipe R320, 1 hr labour R450”"); return; }
    setDraft((d) => ({
      ...d,
      items: [...d.items.filter((i) => i.desc.trim() || num(i.price)), ...items],
      callOut: callOut != null ? String(callOut) : d.callOut,
    }));
    const missing = items.filter((i) => !i.price).length;
    toast(`✨ Added ${items.length} line item${items.length === 1 ? "" : "s"}${missing ? ` · ${missing} need a price` : ""}`);
  };

  const preview = { ...draft, no: draft.no || "Q-" + pad(nextNo), date: draft.date || iso(0), title: draft.title.trim() || "Untitled job", client: draft.client.trim() || "Client name" };
  const t = calc(preview);
  const canSend = draft.items.length > 0;

  const print = () => {
    try { window.print(); } catch (e) {}
    toast("If no print dialog opened, use your browser menu → Print / Save as PDF");
  };

  return (
    <div className="slide-up space-y-5 pb-28">
      <div className="flex items-center gap-2">
        <button onClick={onBack} className="rounded-full p-2 text-slate-300 hover:bg-slate-800" aria-label="Back"><Icon name="arrowLeft" size={22} /></button>
        <h1 className="text-xl font-extrabold text-white">{draft.id ? "Edit quote" : "New quote"}</h1>
      </div>

      <section className="space-y-3 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
        <Field label="Job title"><input className={inputCls} placeholder="e.g. Burst geyser repair" value={draft.title} onChange={(e) => upd({ title: e.target.value })} /></Field>
        <div className="grid gap-3 sm:grid-cols-2">
          <Field label="Client name"><input className={inputCls} placeholder="e.g. Sipho Nkosi" value={draft.client} onChange={(e) => upd({ client: e.target.value })} /></Field>
          <Field label="Client WhatsApp number"><input className={inputCls} inputMode="tel" placeholder="082 123 4567" value={draft.phone} onChange={(e) => upd({ phone: e.target.value })} /></Field>
        </div>
      </section>

      <section className="rounded-2xl border border-emerald-500/30 bg-gradient-to-b from-emerald-500/10 to-slate-900/60 p-4">
        <div className="mb-2 flex items-center justify-between">
          <div className="flex items-center gap-2 font-bold text-emerald-400"><Icon name="sparkles" /> Quick-Text Builder</div>
          <button className="text-xs font-semibold text-emerald-300 underline underline-offset-2" onClick={() => upd({ notes: SAMPLE_NOTES })}>Try example</button>
        </div>
        <textarea className={`${inputCls} min-h-[104px]`} placeholder="Paste or type rough job notes… e.g. Burst geyser repair, 2x copper pipe R320, 1x pressure valve R380, 2 hrs labour R450"
          value={draft.notes} onChange={(e) => upd({ notes: e.target.value })} />
        <button className={`${btnPrimary} mt-3 w-full`} onClick={magic}><Icon name="sparkles" /> Magic Fill Line Items</button>
        <p className="mt-2 text-xs text-slate-400">Separate items with commas or new lines. “2x pipe R320” = 2 × R320 each. “2 hrs labour R450” = 2 hrs at R450/hr.</p>
      </section>

      <section className="space-y-3 rounded-2xl border border-slate-800 bg-slate-900/60 p-4">
        <div className="flex items-center justify-between">
          <h3 className="font-bold text-white">Line items</h3>
          <button className="inline-flex items-center gap-1 rounded-lg bg-slate-800 px-3 py-1.5 text-sm font-semibold text-emerald-400 active:scale-95" onClick={addItem}><Icon name="plus" size={16} /> Add</button>
        </div>
        {draft.items.length === 0 && <div className="rounded-xl border border-dashed border-slate-700 py-6 text-center text-sm text-slate-500">No items yet. Use Magic Fill above or tap Add.</div>}
        {draft.items.map((i) => (
          <div key={i.id} className="rounded-xl border border-slate-800 bg-slate-950/60 p-3">
            <div className="flex items-center gap-2">
              <input className={inputCls} placeholder="Description" value={i.desc} onChange={(e) => updItem(i.id, { desc: e.target.value })} />
              <button onClick={() => rmItem(i.id)} className="shrink-0 rounded-lg p-2.5 text-red-400 hover:bg-red-500/10" aria-label="Remove item"><Icon name="trash" /></button>
            </div>
            <div className="mt-2 grid grid-cols-[4.5rem_1fr_auto] items-center gap-2">
              <input className={inputCls} inputMode="decimal" placeholder="Qty" value={i.qty} onChange={(e) => updItem(i.id, { qty: e.target.value })} />
              <div className="relative"><span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">R</span>
                <input className={`${inputCls} pl-8`} inputMode="decimal" placeholder="Unit price" value={i.price} onChange={(e) => updItem(i.id, { price: e.target.value })} /></div>
              <div className="min-w-[5.5rem] text-right text-sm font-semibold text-white">{money(num(i.qty) * num(i.price))}</div>
            </div>
          </div>
        ))}
        <div className="grid items-end gap-3 sm:grid-cols-2">
          <Field label="Call-out fee">
            <div className="relative"><span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">R</span>
              <input className={`${inputCls} pl-8`} inputMode="decimal" placeholder="0.00" value={draft.callOut} onChange={(e) => upd({ callOut: e.target.value })} /></div>
          </Field>
          <button type="button" onClick={() => upd({ vat: !draft.vat })} className="flex items-center justify-between rounded-xl border border-slate-700 bg-slate-900 px-4 py-3">
            <span className="text-left"><span className="block text-sm font-semibold text-white">Add 15% VAT</span><span className="block text-xs text-slate-500">South African VAT</span></span>
            <span className={`relative h-7 w-12 rounded-full transition ${draft.vat ? "bg-emerald-500" : "bg-slate-700"}`}>
              <span className={`absolute top-0.5 h-6 w-6 rounded-full bg-white transition-all ${draft.vat ? "left-[1.375rem]" : "left-0.5"}`} />
            </span>
          </button>
        </div>
        <div className="flex items-center justify-between rounded-xl bg-slate-950/60 px-4 py-3">
          <span className="text-sm text-slate-400">Grand total{draft.vat ? " (incl. VAT)" : ""}</span>
          <span className="text-xl font-extrabold text-emerald-400">{money(t.total)}</span>
        </div>
      </section>

      <section>
        <div className="mb-2 flex items-center gap-2 text-sm font-semibold text-slate-300"><Icon name="file" size={16} /> Live preview</div>
        <QuotePreview job={preview} biz={biz} />
      </section>

      <div className="fixed inset-x-0 bottom-0 z-30 border-t border-slate-800 bg-slate-950/95 px-4 pb-4 pt-3 backdrop-blur">
        <div className="mx-auto grid max-w-2xl grid-cols-3 gap-2">
          <a className={`${btnWa} col-span-3 sm:col-span-1 ${canSend ? "" : "opacity-50 pointer-events-none"}`}
             href={waLink(draft.phone, docMessage({ ...preview, items: draft.items }, biz))} target="_blank" rel="noopener noreferrer"
             onClick={() => { onSave(false); toast("Saved & opening WhatsApp…"); }}><Icon name="chat" /> Send via WhatsApp</a>
          <button className={btnGhost} onClick={print}><Icon name="printer" /> Print / PDF</button>
          <button className={`${btnPrimary} col-span-2 sm:col-span-1`} onClick={() => onSave(true)}><Icon name="check" /> Save Quote</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Business settings ---------- */
function BusinessModal({ biz, setBiz, onClose }) {
  const set = (k) => (e) => setBiz({ ...biz, [k]: e.target.value });
  return (
    <Modal title="Business profile & payments" onClose={onClose}>
      <div className="space-y-4">
        <Field label="Business name"><input className={inputCls} value={biz.name} onChange={set("name")} /></Field>
        <div className="grid gap-3 sm:grid-cols-2">
          <Field label="Phone"><input className={inputCls} value={biz.phone} onChange={set("phone")} /></Field>
          <Field label="Email"><input className={inputCls} value={biz.email} onChange={set("email")} /></Field>
        </div>
        <Field label="Address"><input className={inputCls} value={biz.address} onChange={set("address")} /></Field>
        <Field label="VAT / Reg number"><input className={inputCls} value={biz.vatNo} onChange={set("vatNo")} /></Field>

        <div className="rounded-2xl border border-emerald-500/30 bg-emerald-500/5 p-4 space-y-3">
          <div className="flex items-center gap-2 font-bold text-emerald-400"><Icon name="wallet" /> EFT banking details</div>
          <Field label="Bank name"><input className={inputCls} value={biz.bankName} onChange={set("bankName")} /></Field>
          <Field label="Account name"><input className={inputCls} value={biz.accName} onChange={set("accName")} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Account number"><input className={inputCls} inputMode="numeric" value={biz.accNo} onChange={set("accNo")} /></Field>
            <Field label="Branch code"><input className={inputCls} inputMode="numeric" value={biz.branch} onChange={set("branch")} /></Field>
          </div>
          <Field label="Yoco / PayFast payment link (optional)" hint="Clients can pay by card from WhatsApp. Leave blank to hide.">
            <input className={inputCls} placeholder="https://pay.yoco.com/your-business" value={biz.payLink} onChange={set("payLink")} />
          </Field>
        </div>
        <p className="text-xs text-slate-500">Sample details only — replace with your real banking info. Changes apply to every quote instantly.</p>
        <button className={`${btnPrimary} w-full`} onClick={onClose}><Icon name="check" /> Done</button>
      </div>
    </Modal>
  );
}

/* ---------- Pricing ---------- */
function PricingModal({ onClose, toast }) {
  return (
    <Modal title="Choose your plan" onClose={onClose} wide>
      <p className="mb-4 text-sm text-slate-400">Simple monthly pricing in Rands. Cancel any time. No contracts.</p>
      <div className="grid gap-3 sm:grid-cols-2">
        {TIERS.map((t) => (
          <div key={t.name} className={`relative rounded-2xl border p-4 ${t.popular ? "border-emerald-500 bg-emerald-500/5" : "border-slate-800 bg-slate-900/60"}`}>
            {t.popular && <span className="absolute -top-2.5 right-4 rounded-full bg-emerald-500 px-2.5 py-0.5 text-[11px] font-bold text-slate-950">Most popular</span>}
            <div className="flex items-baseline justify-between">
              <div className="text-lg font-extrabold text-white">{t.name}</div>
              <div><span className="text-2xl font-extrabold text-emerald-400">{t.price}</span><span className="text-xs text-slate-500"> {t.per}</span></div>
            </div>
            <div className="text-xs text-slate-500">{t.blurb}</div>
            <ul className="my-3 space-y-1.5 text-sm text-slate-300">
              {t.features.map((f) => <li key={f} className="flex items-start gap-2"><Icon name="check" size={16} className="mt-0.5 shrink-0 text-emerald-400" />{f}</li>)}
            </ul>
            {t.name === "Starter"
              ? <div className={`${btnGhost} w-full opacity-70`}>Current plan</div>
              : <button className={`${t.popular ? btnPrimary : btnGhost} w-full`} onClick={() => { toast(`Demo only — ${t.name} upgrade isn't live yet`); onClose(); }}>Upgrade to {t.name}</button>}
          </div>
        ))}
      </div>
      <p className="mt-4 text-center text-xs text-slate-500">All prices include VAT.</p>
    </Modal>
  );
}

/* ---------- App ---------- */
function App() {
  const [biz, setBiz] = useState(INITIAL_BIZ);
  const [jobs, setJobs] = useState(INITIAL_JOBS);
  const [counter, setCounter] = useState(103);
  const [view, setView] = useState("home");
  const [draft, setDraft] = useState(EMPTY_DRAFT());
  const [filter, setFilter] = useState("all");
  const [modal, setModal] = useState(null); // 'biz' | 'pricing'
  const [viewing, setViewing] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = React.useRef(null);

  const toast = (m) => {
    setToastMsg(m);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 3200);
  };

  const totals = useMemo(() => {
    const sum = (st) => r2(jobs.filter((j) => j.status === st).reduce((s, j) => s + calc(j).total, 0));
    return { quoted: sum("quoted"), paid: sum("paid"), unpaid: sum("unpaid") };
  }, [jobs]);

  const startNew = () => { setDraft(EMPTY_DRAFT()); setView("builder"); window.scrollTo(0, 0); };
  const edit = (job) => { setDraft({ ...job, notes: "" }); setView("builder"); window.scrollTo(0, 0); };

  const save = (goHome) => {
    const items = draft.items.filter((i) => i.desc.trim() || num(i.price));
    const base = { ...draft, items, title: draft.title.trim() || "Untitled job", client: draft.client.trim() || "Client" };
    let saved;
    if (!base.id) {
      saved = { ...base, id: uid(), no: "Q-" + pad(counter), status: "quoted", date: iso(0) };
      setCounter((c) => c + 1);
      setJobs((js) => [saved, ...js]);
    } else {
      saved = base;
      setJobs((js) => js.map((j) => (j.id === saved.id ? saved : j)));
    }
    setDraft({ ...saved, notes: draft.notes });
    if (goHome) { toast(`Quote ${saved.no} saved — ${money(calc(saved).total)}`); setView("home"); setFilter("all"); window.scrollTo(0, 0); }
  };

  const convert = (id) => {
    const job = jobs.find((j) => j.id === id);
    const no = job.no.replace(/^Q-/, "INV-");
    setJobs((js) => js.map((j) => j.id === id ? { ...j, status: "unpaid", no, date: iso(0), due: iso(7) } : j));
    toast(`Converted to invoice ${no} — ${money(calc(job).total)} now in Unpaid`);
  };
  const markPaid = (id) => {
    const job = jobs.find((j) => j.id === id);
    setJobs((js) => js.map((j) => j.id === id ? { ...j, status: "paid", paidDate: iso(0) } : j));
    toast(`💰 ${money(calc(job).total)} moved to Paid`);
    setViewing((v) => (v && v.id === id ? null : v));
  };

  const shown = jobs.filter((j) => filter === "all" || j.status === filter);
  const liveViewing = viewing ? jobs.find((j) => j.id === viewing.id) : null;

  return (
    <div className="mx-auto min-h-screen max-w-2xl px-4 pb-10 text-slate-200">
      <header className="sticky top-0 z-20 -mx-4 flex items-center justify-between border-b border-slate-800/80 bg-slate-950/90 px-4 py-3 backdrop-blur">
        <div className="flex items-center gap-2.5">
          <div className="grid h-9 w-9 place-items-center rounded-xl bg-emerald-500 text-slate-950"><Icon name="file" size={20} /></div>
          <div className="leading-tight">
            <div className="text-base font-extrabold text-white">Mzansi<span className="text-emerald-400">Quote</span></div>
            <div className="max-w-[10.5rem] truncate text-[11px] text-slate-500">{biz.name}</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setModal("pricing")} className="inline-flex items-center gap-1.5 rounded-full border border-emerald-500/40 bg-emerald-500/10 px-3 py-1.5 text-xs font-bold text-emerald-300 active:scale-95">
            <Icon name="crown" size={14} /> Plan: Starter (Free)
          </button>
          <button onClick={() => setModal("biz")} className="rounded-full border border-slate-700 bg-slate-900 p-2 text-slate-300 active:scale-95" aria-label="Business profile"><Icon name="briefcase" size={18} /></button>
        </div>
      </header>

      <main className="pt-5">
        {view === "builder" ? (
          <Builder draft={draft} setDraft={setDraft} biz={biz} nextNo={counter} onBack={() => setView("home")} onSave={save} toast={toast} />
        ) : (
          <div className="space-y-5 fade-in">
            <section>
              <div className="mb-2 text-sm text-slate-400">Howzit! Here's your money snapshot 👋</div>
              <div className="grid grid-cols-3 gap-2">
                <div className="rounded-2xl border border-amber-500/20 bg-slate-900 p-3">
                  <div className="flex items-center gap-1 text-[11px] font-semibold text-amber-400"><Icon name="clock" size={12} /> Quoted</div>
                  <div className="text-[10px] text-slate-500">Pending</div>
                  <div className="mt-1.5 text-[13px] font-extrabold leading-tight text-white sm:text-lg">{money(totals.quoted)}</div>
                </div>
                <div className="rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-3">
                  <div className="flex items-center gap-1 text-[11px] font-semibold text-emerald-400"><Icon name="checkCircle" size={12} /> Paid</div>
                  <div className="text-[10px] text-slate-500">Collected</div>
                  <div className="mt-1.5 text-[13px] font-extrabold leading-tight text-white sm:text-lg">{money(totals.paid)}</div>
                </div>
                <div className="rounded-2xl border border-red-500/25 bg-slate-900 p-3">
                  <div className="flex items-center gap-1 text-[11px] font-semibold text-red-400"><Icon name="alert" size={12} /> Unpaid</div>
                  <div className="text-[10px] text-slate-500">Owed</div>
                  <div className="mt-1.5 text-[13px] font-extrabold leading-tight text-white sm:text-lg">{money(totals.unpaid)}</div>
                </div>
              </div>
              <button onClick={startNew} className={`${btnPrimary} mt-3 w-full py-4 text-base shadow-lg shadow-emerald-500/20`}><Icon name="plus" size={20} /> New Quote</button>
            </section>

            <section>
              <div className="mb-3 flex items-center justify-between">
                <h2 className="text-lg font-extrabold text-white">Jobs & cash flow</h2>
                <span className="text-xs text-slate-500">{jobs.length} jobs</span>
              </div>
              <div className="mb-3 flex gap-2 overflow-x-auto pb-1">
                {[["all", "All"], ["quoted", "Quoted"], ["unpaid", "Unpaid"], ["paid", "Paid"]].map(([k, l]) => (
                  <button key={k} onClick={() => setFilter(k)} className={`shrink-0 rounded-full px-4 py-1.5 text-sm font-semibold ${filter === k ? "bg-emerald-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800"}`}>{l}</button>
                ))}
              </div>
              <div className="space-y-3">
                {shown.map((j) => <JobCard key={j.id} job={j} biz={biz} onView={setViewing} onEdit={edit} onConvert={convert} onPaid={markPaid} />)}
                {shown.length === 0 && <div className="rounded-2xl border border-dashed border-slate-800 py-10 text-center text-sm text-slate-500">Nothing here yet.</div>}
              </div>
            </section>
          </div>
        )}
      </main>

      {liveViewing && (
        <Modal title={`${liveViewing.status === "quoted" ? "Quote" : "Invoice"} ${liveViewing.no}`} onClose={() => setViewing(null)} wide>
          <QuotePreview job={liveViewing} biz={biz} />
          <div className="mt-4 grid grid-cols-2 gap-2">
            <a className={btnWa} href={waLink(liveViewing.phone, docMessage(liveViewing, biz))} target="_blank" rel="noopener noreferrer"><Icon name="chat" /> Send via WhatsApp</a>
            <button className={btnGhost} onClick={() => { try { window.print(); } catch (e) {} toast("If no print dialog opened, use your browser menu → Print / Save as PDF"); }}><Icon name="printer" /> Print / Save PDF</button>
            {liveViewing.status === "unpaid" && <>
              <a className={btnWa} href={waLink(liveViewing.phone, reminderMessage(liveViewing, biz))} target="_blank" rel="noopener noreferrer"><Icon name="bell" /> Payment Reminder</a>
              <button className={btnPrimary} onClick={() => markPaid(liveViewing.id)}><Icon name="checkCircle" /> Mark as Paid</button>
            </>}
            {liveViewing.status === "quoted" && (
              <button className={`${btnPrimary} col-span-2`} onClick={() => { convert(liveViewing.id); }}><Icon name="repeat" /> Convert to Unpaid Invoice</button>
            )}
          </div>
        </Modal>
      )}
      {modal === "biz" && <BusinessModal biz={biz} setBiz={setBiz} onClose={() => setModal(null)} />}
      {modal === "pricing" && <PricingModal onClose={() => setModal(null)} toast={toast} />}

      {toastMsg && (
        <div className="fixed inset-x-0 bottom-24 z-[60] flex justify-center px-4 pointer-events-none">
          <div className="slide-up max-w-md rounded-2xl border border-emerald-500/40 bg-slate-900 px-4 py-3 text-sm font-medium text-white shadow-2xl">{toastMsg}</div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
